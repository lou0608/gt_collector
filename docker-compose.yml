services:
  gt-collector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gt-collector
    env_file:
      - .env
    environment:
      # Valeurs par défaut si absentes du .env
      TZ: "Europe/Paris"
      PYTHONUNBUFFERED: "1"
    volumes:
      # Tous les fichiers produits par les scripts (CSV) seront écrits ici
      - ./data:/data
      # OPTIONNEL (décommente si tu veux développer sans rebuild image)
      - ./app:/app/app
      - ./logs:/logs
    working_dir: /app
    healthcheck:
      test: [ "CMD", "python", "-m", "app.healthcheck" ]
      interval: 5m
      timeout: 10s
      retries: 3
    restart: unless-stopped
    # Le CMD par défaut de l'image est "python -m app.main".
    # Pour exécuter un script spécifique, utilise: docker compose run --rm gt-collector python -u -m app.search_mid --query "..."

