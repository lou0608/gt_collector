services:
  gt-collector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gt-collector

    environment:
      TZ: "Europe/Paris"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app
      TOPIC_MID: ${TOPIC_MID:-/m/01l2m3}
      TOPIC_LABEL: ${TOPIC_LABEL:-insuffisance_cardiaque}
      GT_OFFLINE_FIXTURE: ${GT_OFFLINE_FIXTURE:-1}

    volumes:
      - ./data:/data
      - ./logs:/logs
      - ./app:/app/app
      - ./scripts:/app/scripts

    working_dir: /app

    healthcheck:
      test: [ "CMD", "python", "-m", "app.healthcheck" ]
      interval: 5m
      timeout: 10s
      retries: 3

    restart: unless-stopped
