services:
  gt-collector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gt-collector

    # ⚠️ Supprimé l'env_file obligatoire (.env)
    # On passe les variables directement dans environment.
    environment:
      # Valeurs par défaut si absentes
      TZ: "Europe/Paris"
      PYTHONUNBUFFERED: "1"
      TOPIC_MID: ${TOPIC_MID:-/m/01l2m3}
      TOPIC_LABEL: ${TOPIC_LABEL:-insuffisance_cardiaque}
      GT_OFFLINE_FIXTURE: ${GT_OFFLINE_FIXTURE:-1}

    volumes:
      - ./data:/data # CSV générés par les scripts
      - ./app:/app/app # optionnel: dev sans rebuild image
      - ./logs:/logs

    working_dir: /app

    healthcheck:
      test: [ "CMD", "python", "-m", "app.healthcheck" ]
      interval: 5m
      timeout: 10s
      retries: 3

    restart: unless-stopped
