name: CI

on:
  push:
    branches:
      - main
      - feat/hourly-flags
  pull_request:
    branches:
      - main
      - feat/hourly-flags

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Run Ruff lint (relaxed rules)
        run: |
          ruff check . --line-length=120 --ignore F401,F841,F811

      - name: Run tests
        run: |
          pytest tests/ -q -v
