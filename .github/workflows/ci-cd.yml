name: CI-CD (manual only)

on:
  workflow_dispatch:   # <-- déclenchement uniquement manuel

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff lint (relaxed rules)
        run: |
          pip install ruff
          ruff check . --line-length=120 --ignore F401,F841,F811

  build-and-push:
    needs: ci
    runs-on: ubuntu-latest
    if: success()     # seulement si la CI passe
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build package
        run: echo "Build step (placeholder)"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: success()     # seulement si le build passe
    steps:
      - name: Deploy
        run: echo "Deploy step (placeholder)"
