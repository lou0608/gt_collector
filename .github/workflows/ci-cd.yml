name: CI-CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:   # <-- déclenchement manuel toujours possible

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"   # compatible avec ton run_topic corrigé

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff lint (relaxed rules)
        run: |
          pip install ruff
          ruff check . --line-length=120 --ignore F401,F841,F811

      - name: Basic test - run_topic compiles
        run: python -m py_compile app/run_topic.py

      - name: Basic test - topics.txt exists
        run: test -f config/topics.txt

  build-and-push:
    needs: ci
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build package
        run: echo "Build step (placeholder)"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Deploy
        run: echo "Deploy step (placeholder)"
