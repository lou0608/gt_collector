name: Schedule - Run All

on:
  push:
    branches:
      - feat/hourly-flags   # TEMPORAIRE : permet de tester avant merge dans main
  workflow_dispatch:         # permet de lancer manuellement depuis Actions
  schedule:
    - cron: "0 4 * * *"      # 04:00 UTC → 06:00 Paris (tous les jours)

jobs:
  run-all:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker
        run: |
          docker --version
          docker compose version

      - name: Build services
        run: docker compose build

      - name: Run offline pipeline
        run: |
          docker compose run --rm \
            -e PYTHONUNBUFFERED=1 \
            -e PYTHONPATH=/app \
            -e GT_OFFLINE_FIXTURE=1 \
            -e TOPIC_MID="/m/01l2m3" \
            -e TOPIC_LABEL="insuffisance_cardiaque" \
            gt-collector \
            python -u scripts/run_all.py

      - name: Upload CSV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trends-csv-${{ github.run_id }}
          path: data/*.csv
