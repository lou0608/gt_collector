name: Google Trends Daily Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"    # 04:00 UTC / 06:00 Paris

env:
  PYTHONUNBUFFERED: "1"
  GT_NO_DOCKER: "1"
  RUN_TOPIC_MID: "/m/0k95h"   # MID pour 'hypertension'
  # Réglages "run court" pour éviter les jobs qui s'éternisent en cas d'erreurs
  GT_MAX_CALLS: "20"
  GT_RETRIES: "3"
  GT_BASE_BACKOFF: "10"
  GT_PREJITTER_MIN: "1"
  GT_PREJITTER_MAX: "3"

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare data directories
        run: |
          mkdir -p data/logs
          mkdir -p data/raw/daily
          mkdir -p data/raw/hourly

      - name: Run DAILY only (no hourly)
        run: |
          python -m app.tools.run_daily_only --topic-mid "${RUN_TOPIC_MID}" --topic-label "hypertension"

      - name: Upload CSV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trends-csv
          if-no-files-found: warn
          path: |
            data/**/*.csv
            data/*.csv
