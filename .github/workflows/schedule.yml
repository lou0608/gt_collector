name: Google Trends Daily Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"    # 04:00 UTC / 06:00 Paris

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline (Cardiologie)
        env:                # ✅ ICI : définir les variables correctement
          GT_NO_DOCKER: "1"
          RUN_TOPIC_MID: "/m/0dg3n"
        run: |
          python scripts/run_all.py

      - name: Upload CSV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trends-csv
          path: data/*.csv
