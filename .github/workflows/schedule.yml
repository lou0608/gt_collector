name: Google Trends Daily Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"    # 04:00 UTC / 06:00 Paris

env:
  PYTHONUNBUFFERED: "1"
  GT_MAX_CALLS: "20"     # limite d’appels par run
  GT_GEO: "FR"

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # important pour accéder à toutes les branches

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build images
        run: docker compose build

      - name: Run full pipeline (run_all)
        run: |
          docker compose run --rm \
            -e GT_MAX_CALLS=${GT_MAX_CALLS} \
            -e GT_GEO=${GT_GEO} \
            gt-collector python -u scripts/run_all.py

      - name: Upload CSV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trends-csv
          if-no-files-found: warn
          path: |
            data/**/*.csv
            data/*.csv

      - name: Merge old CSV with new
        run: |
          # Récupérer la dernière version de data-branch si elle existe
          git fetch origin data-branch || true
          git checkout data-branch || git checkout -b data-branch
          
          # Sauvegarder les anciens fichiers s’ils existent
          cp topics_all.csv old_topics_all.csv 2>/dev/null || true
          cp calls_all.csv old_calls_all.csv 2>/dev/null || true
          cp meter.csv old_meter.csv 2>/dev/null || true

          # Revenir sur la branche principale pour copier les nouveaux fichiers
          git checkout main

          # Copier les nouveaux fichiers générés par Docker à la racine
          cp data/processed/topics_all.csv new_topics_all.csv
          cp data/logs/calls_all.csv new_calls_all.csv
          cp data/logs/meter.csv new_meter.csv
          
          # Concaténation : anciens + nouveaux
          if [ -f old_topics_all.csv ]; then
            head -n 1 new_topics_all.csv > topics_all.csv
            tail -n +2 old_topics_all.csv >> topics_all.csv
            tail -n +2 new_topics_all.csv >> topics_all.csv
          else
            mv new_topics_all.csv topics_all.csv
          fi

          if [ -f old_calls_all.csv ]; then
            head -n 1 new_calls_all.csv > calls_all.csv
            tail -n +2 old_calls_all.csv >> calls_all.csv
            tail -n +2 new_calls_all.csv >> calls_all.csv
          else
            mv new_calls_all.csv calls_all.csv
          fi

          if [ -f old_meter.csv ]; then
            head -n 1 new_meter.csv > meter.csv
            tail -n +2 old_meter.csv >> meter.csv
            tail -n +2 new_meter.csv >> meter.csv
          else
            mv new_meter.csv meter.csv
          fi

      - name: Push CSV to data-branch
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git checkout -B data-branch

          # Pousser les fichiers cumulés pour Power BI
          git add -f topics_all.csv calls_all.csv meter.csv || true
          git commit -m "Update CSV from $(date)" || echo "No changes to commit"
          git push origin data-branch --force
