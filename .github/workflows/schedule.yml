name: Google Trends Daily Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"    # 04:00 UTC / 06:00 Paris

env:
  PYTHONUNBUFFERED: "1"
  GT_MAX_CALLS: "20"     # limite d’appels par run
  GT_GEO: "FR"

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build images
        run: docker compose build

      - name: Run full pipeline (run_all)
        run: |
          docker compose run --rm \
            -e GT_MAX_CALLS=${GT_MAX_CALLS} \
            -e GT_GEO=${GT_GEO} \
            gt-collector python -u scripts/run_all.py

      - name: Upload CSV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trends-csv
          if-no-files-found: warn
          path: |
            data/**/*.csv
            data/*.csv

      - name: Push CSV to data-branch
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git fetch origin
          git checkout -B data-branch

          # Copier les fichiers clés pour Power BI
          cp data/processed/topics_all.csv .
          cp data/logs/calls_all.csv .
          cp data/logs/meter.csv .

          git add -f *.csv || true
          git commit -m "Update CSV from $(date)" || echo "No changes to commit"

          git push origin data-branch --force
