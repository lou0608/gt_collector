name: Google Trends Daily Pipeline

on:
  workflow_dispatch:
  #schedule:
    # 09:00 UTC = 11:00 Paris
    #- cron: "0 9 * * *"

env:
  PYTHONUNBUFFERED: "1"
  GT_MAX_CALLS: "2"     # limiter les appels API pour éviter les 429
  GT_GEO: "FR"
  PYTHONPATH: "."
  OUTDIR: "data"

permissions:
  contents: write

concurrency:
  group: gt_schedule_new
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout main (code)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Ensure data dirs
        run: mkdir -p data/logs data/processed data/config data/state

      # Récupérer la branche data-branch (historique outputs + state)
      - name: Checkout data-branch
        uses: actions/checkout@v4
        with:
          ref: data-branch
          path: data-branch

      - name: Restore topic pointer
        run: |
          if [ -f data-branch/data/state/topic_pointer.json ]; then
            cp data-branch/data/state/topic_pointer.json data/state/
          fi

      # Orchestrateur : next_topic + run_topic + aggregate_calls_meter
      - name: Run orchestrator (topics + logs)
        env:
          OUTDIR: ${{ github.workspace }}/data-branch/data
          GT_MAX_CALLS: "2"
        run: |
          python -m app.run_all

      - name: Upload CSV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trends-csv
          if-no-files-found: warn
          path: data-branch/data/processed/*.csv

      - name: Commit & push results to data-branch
        run: |
          cd data-branch
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/processed data/state || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "GT: $(date -u +'%Y-%m-%d') orchestrator run"
            git push origin HEAD:data-branch
          fi
