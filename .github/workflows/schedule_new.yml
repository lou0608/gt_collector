name: Google Trends Daily Pipeline

on:
  workflow_dispatch:
  schedule:
    # Tous les jours à 11h (heure UTC)
    - cron: "0 9 * * *"

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Prepare folders
        run: |
          mkdir -p data/logs data/processed data/config data/state

      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data-branch
          path: data-branch

      - name: Restore topic pointer
        run: |
          if [ -f data-branch/data/state/topic_pointer.json ]; then
            cp data-branch/data/state/topic_pointer.json data/state/topic_pointer.json
          fi

      - name: Run orchestrator (topics + logs)
        env:
          OUTDIR: ${{ github.workspace }}/data-branch/data
          GT_MAX_CALLS: "2"
        run: |
          python -m app.run_all

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trends-csv
          path: data-branch/data/processed/*.csv

      - name: Commit & push results to data-branch
        run: |
          cd data-branch
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/*.csv data/state/topic_pointer.json
          git commit -m "GT: $(date +'%Y-%m-%d') orchestrator run"
          git push origin data-branch
